worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    application/javascript
    application/json
    application/xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream melody_backend {
    zone melody_backend 64k;
    server backend:8080 resolve;
  }

  upstream melody_client {
    zone melody_client 64k;
    server client:80 resolve;
  }

  upstream melody_admin {
    zone melody_admin 64k;
    server admin:80 resolve;
  }

  server {
    listen 80;
    server_name golmelo.com www.golmelo.com 45.159.150.80;

    location / {
      return 301 https://golmelo.com$request_uri;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name www.golmelo.com;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_trusted_certificate /etc/nginx/certs/fullchain.pem;

    return 301 https://golmelo.com$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name golmelo.com;

    client_max_body_size 128m;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_trusted_certificate /etc/nginx/certs/fullchain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=15552000" always;

    location = /admin {
      return 301 /admin/;
    }

    location ^~ /admin/ {
      proxy_pass http://melody_admin/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location ^~ /admin/assets/ {
      proxy_pass http://melody_admin/assets/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /assets/ {
      proxy_pass http://melody_client;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /fonts/ {
      proxy_pass http://melody_client;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:png|jpe?g|webp|gif|ico|svg|webmanifest)$ {
      proxy_pass http://melody_client;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location ^~ /api/ {
      proxy_pass http://melody_backend;
      proxy_http_version 1.1;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location = /health {
      proxy_pass http://melody_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location / {
      proxy_pass http://melody_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
